<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - CWK Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    },
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --card: 0 0% 100%;
            --card-foreground: 240 10% 3.9%;
            --primary: 240 5.9% 10%;
            --primary-foreground: 0 0% 98%;
            --secondary: 240 4.8% 95.9%;
            --secondary-foreground: 240 5.9% 10%;
            --muted: 240 4.8% 95.9%;
            --muted-foreground: 240 3.8% 46.1%;
            --accent: 240 4.8% 95.9%;
            --accent-foreground: 240 5.9% 10%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 0 0% 98%;
            --border: 240 5.9% 90%;
            --input: 240 5.9% 90%;
            --ring: 240 5.9% 10%;
            --radius: 0.5rem;
        }
        .dark {
            --background: 240 10% 3.9%;
            --foreground: 0 0% 98%;
            --card: 240 10% 5.5%;
            --card-foreground: 0 0% 98%;
            --primary: 0 0% 98%;
            --primary-foreground: 240 5.9% 10%;
            --secondary: 240 3.7% 15.9%;
            --secondary-foreground: 0 0% 98%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%;
            --accent: 240 3.7% 15.9%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 0 0% 98%;
            --border: 240 3.7% 15.9%;
            --input: 240 3.7% 15.9%;
            --ring: 240 4.9% 83.9%;
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-background text-foreground min-h-screen flex items-center justify-center p-4 relative antialiased">
    <!-- Top Theme Switcher -->
    <div class="absolute top-4 right-4">
        <button onclick="toggleTheme()" type="button" aria-label="Toggle Theme" class="p-2 rounded-md hover:bg-accent text-muted-foreground hover:text-foreground transition-colors border border-border bg-card shadow-xs">
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
    </div>

    <!-- Background Subtle Glow Effect -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10 flex items-center justify-center">
        <div class="w-[500px] h-[500px] rounded-full bg-primary/5 blur-3xl"></div>
    </div>

    <!-- shadcn Card -->
    <div class="w-full max-w-md rounded-xl border border-border bg-card text-card-foreground shadow-sm">
        <!-- Card Header -->
        <div class="flex flex-col space-y-2 p-6 sm:p-8 pb-4">
            <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-primary-foreground mb-2 shadow-xs">
                <i data-lucide="swords" class="w-5 h-5"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-foreground">Card Wars Kingdom</h1>
            <p class="text-sm text-muted-foreground">Sign in with your administrator credentials to access the console</p>
        </div>

        <!-- Card Content -->
        <div class="p-6 sm:p-8 pt-2">
            <form method="post" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-foreground">
                        Username
                    </label>
                    <div class="relative">
                        <input
                            type="text"
                            name="username"
                            required
                            autocomplete="username"
                            placeholder="admin"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-1 disabled:cursor-not-allowed disabled:opacity-50"
                        >
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-foreground">
                            Password
                        </label>
                    </div>
                    <div class="relative">
                        <input
                            type="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••••••"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-1 disabled:cursor-not-allowed disabled:opacity-50"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full mt-2 shadow-xs cursor-pointer"
                >
                    Sign In
                </button>
            </form>

            <div class="relative my-5">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-border"></span></div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-card px-2 text-muted-foreground">or use passkey</span>
                </div>
            </div>

            <form method="post" action="/admin/passkey" class="space-y-3">
                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none text-foreground">6-Digit Passkey</label>
                    <input
                        type="text"
                        name="passkey"
                        inputmode="numeric"
                        pattern="\d{6}"
                        maxlength="6"
                        required
                        autocomplete="one-time-code"
                        placeholder="••••••"
                        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-center font-mono text-lg tracking-[0.5em] ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-1"
                    >
                </div>
                <button
                    type="submit"
                    class="inline-flex items-center justify-center gap-1.5 rounded-md text-sm font-medium transition-colors bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2 w-full shadow-xs cursor-pointer"
                >
                    <i data-lucide="fingerprint" class="w-4 h-4"></i>
                    <span>Sign In with Passkey</span>
                </button>
            </form>
        </div>

        <!-- Card Footer -->
        <div class="p-6 sm:p-8 pt-0 border-t border-border/50 text-center">
            <p class="text-xs text-muted-foreground">CWK Private Server &middot; Admin Management Portal</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
